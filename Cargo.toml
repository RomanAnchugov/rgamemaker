[workspace]
resolver = "2"
members = [
    "crates/gml",
    "crates/gmformat",
    "crates/gmengine",
    "crates/gmruntime",
    "crates/gmide",
    "crates/demo-gen",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
